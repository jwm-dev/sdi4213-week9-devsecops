name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject tracked .env files
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must remain local and untracked."
            exit 1
          fi
          echo ".env is not tracked."

      - name: Build hardened image
        run: docker build -t helpdesk:security .

      - name: Enforce non-root runtime user
        shell: bash
        run: |
          USER_ID=$(docker run --rm --entrypoint id helpdesk:security -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" -ne 0
